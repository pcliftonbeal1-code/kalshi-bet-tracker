# Bot settings. Safe to commit: NO secrets go in this file (those live in .env).

[alerts]
# Alert when the edge AFTER Kalshi's fee (fair probability - price - fee) is at
# least this much. 0.03 means 3 percentage points.
min_edge = 0.03
# Re-alert on the same market only if the edge grew by at least this much.
realert_edge_increase = 0.01

[fees]
# Kalshi charges a taker fee of roughly: rate * price * (1 - price) per contract.
# 0.07 is Kalshi's published general rate as of this writing.
# VERIFY at https://kalshi.com/fee-schedule - some markets use a different rate.
taker_fee_rate = 0.07

[std_devs]
# !!! ESTIMATES, NOT MEASURED VALUES !!!
# Standard deviation of each stat around its expected value, used only when
# Kalshi's threshold differs from the sportsbook's line. These are starting
# guesses; refine them later using your own logged results.
qb_pass_yds = 70
rb_rush_yds = 30
team_points = 10

[kalshi]
# Public market-data endpoints. No login is needed to READ prices.
base_url = "https://api.elections.kalshi.com/trade-api/v2"
# Kalshi's basic tier allows ~20 read requests/second. We stay well under it.
requests_per_second = 5
# Seconds to wait for a response before giving up on that request.
timeout_seconds = 15

[kalshi.series]
# Kalshi groups markets into "series". These tickers tell the bot where to look.
# All four confirmed live with `python -m kalshi_bot.kalshi_client --discover`
# (Oct 2026). Re-run it if Kalshi ever renames a series.
moneyline = "KXNFLGAME"
qb_pass_yds = "KXNFLPASSYDS"
rb_rush_yds = "KXNFLRSHYDS"
team_points = "KXNFLTEAMTOTAL"

[odds_api]
# The Odds API (the-odds-api.com). Your key goes in .env as ODDS_API_KEY.
base_url = "https://api.the-odds-api.com/v4"
sport = "americanfootball_nfl"
requests_per_second = 1
timeout_seconds = 15
# Books to ask for. Listing books (instead of whole regions) keeps costs down:
# up to 10 books are billed like ONE region. Pinnacle is the sharpest book, so
# when it's present we use it alone; otherwise we average the US books.
sharp_book = "pinnacle"
fallback_books = ["draftkings", "fanduel", "betmgm"]
# Without Pinnacle, require at least this many US books to agree on a line.
min_fallback_books = 2
# Market keys. Game-level ones come from one cheap call for ALL games;
# per-game ones (props, team totals) cost credits per game.
game_markets = ["h2h"]
event_markets = ["player_pass_yds", "player_rush_yds", "team_totals"]
# How old cached sportsbook odds may get before a full refresh (minutes).
# Old odds only FIND possible edges; nothing alerts until that game's odds are
# re-pulled fresh (confirm_max_age_minutes). So this can be long and cheap.
# Moneylines every 120 min = 12 credits/day if the bot runs all day.
full_refresh_minutes = 120
# Before alerting, re-pull that one game's odds if our copy is older than this.
confirm_max_age_minutes = 5
# Stop spending credits when the remaining monthly quota drops below this.
min_credits_reserve = 25

[loop]
# Minutes between checks. Reading Kalshi is free; sportsbook odds are cached.
poll_minutes = 5
# Props and team totals cost credits PER GAME, per market, per refresh.
# Off by default so the free plan (500 credits/month) lasts. Turn on when you
# have a paid plan, or only on game days.
props = false
# With props on, only fetch them for games starting within this many hours.
props_hours_before_kickoff = 6
# Re-pull one game's odds to confirm an alert at most this often. Stops one
# stubborn fake edge from costing a credit every 5 minutes.
confirm_cooldown_minutes = 30
